<!doctype html>
<html lang="ru" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Лад — аккорды</title>
  <meta name="description" content="Песни с аккордами: транспонирование, схемы, автопрокрутка и текст, который следует за голосом.">
  <meta name="theme-color" content="#0d0e12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Лад">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // тема до первой отрисовки, чтобы не мигало
    try { const s = JSON.parse(localStorage.getItem('lad.v1') || '{}'); document.documentElement.dataset.theme = (s.settings && s.settings.theme) || 'auto'; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a href="#/" class="logo" aria-label="Лад — на главную">
      <span class="logo-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 4v16M12 4v16M18 4v16M4 9h16M4 15h16"/></svg>
      </span>
      <span>Лад</span>
    </a>
    <span class="spacer"></span>
    <button class="icon-btn" id="themeBtn" aria-label="Сменить тему">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main id="view" tabindex="-1"></main>

  <div class="dock" id="dock" aria-label="Управление песней">
    <div class="heard" id="heard"></div>
    <div class="dock-row">
      <div class="dock-group" aria-label="Тональность">
        <button class="icon-btn" data-act="tr-" aria-label="Понизить на полтона">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>
        </button>
        <button class="dock-val" id="trVal" data-act="tr0" aria-label="Сбросить тональность">0</button>
        <button class="icon-btn" data-act="tr+" aria-label="Повысить на полтона">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="dock-group" aria-label="Размер шрифта">
        <button class="icon-btn" data-act="fs-" aria-label="Шрифт меньше"><span style="font-weight:800;font-size:13px">A</span></button>
        <button class="icon-btn" data-act="fs+" aria-label="Шрифт больше"><span style="font-weight:800;font-size:19px">A</span></button>
      </div>
      <button class="icon-btn" data-act="scroll" id="scrollBtn" aria-label="Автопрокрутка">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M6 14l6 6 6-6"/></svg>
      </button>
      <button class="mic" data-act="mic" id="micBtn" aria-label="Следовать за голосом">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
    </div>
    <div class="dock-extra">
      <span>Скорость</span>
      <input type="range" id="speed" min="6" max="120" step="1" aria-label="Скорость прокрутки">
      <button class="icon-btn" data-act="scroll" aria-label="Остановить прокрутку">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
    </div>
  </div>

  <footer class="tabbar">
    <nav aria-label="Разделы">
      <a class="tab" href="#/" data-tab="home">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>
        Популярное
      </a>
      <a class="tab" href="#/artists" data-tab="artists">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        Исполнители
      </a>
      <a class="tab tab-add" href="#/add" data-tab="add" aria-label="Добавить песню">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Добавить
      </a>
      <a class="tab" href="#/favs" data-tab="favs">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>
        Избранное
      </a>
      <a class="tab" href="#/settings" data-tab="settings">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
        Ещё
      </a>
    </nav>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
